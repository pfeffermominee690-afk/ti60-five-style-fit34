# Dedicated profile for the official cacheless CPU and on-chip firmware.
# The common FTDI configuration is loaded first by deploy.py.
gdb_target_description disable
adapter speed 800
adapter srst delay 260
jtag_ntrst_delay 250
set _CHIPNAME fpga_spinal
jtag newtap $_CHIPNAME bridge -expected-id $_CPUTAPID -irlen 5 -ircapture 0x5 -irmask 0xF
target create $_CHIPNAME.cpu0 vexriscv -endian little -chain-position $_CHIPNAME.bridge -coreid 0 -dbgbase 0x10B80000 -work-area-phys 0xF9003C00 -work-area-size 1024
vexriscv readWaitCycles 40
vexriscv cpuConfigFile {tools/debug/cpu0.yaml}
vexriscv jtagMapping 8 8 0 1 2 2
targets $_CHIPNAME.cpu0
poll_period 50
init
halt
